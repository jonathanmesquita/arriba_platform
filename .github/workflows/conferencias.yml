# Conferências do site em todo PR e em todo push na main.
# O site não tem build: o que pode quebrar sem ninguém ver é sintaxe de
# JavaScript (não há bundler para acusar), a lógica pura das ferramentas
# e o contraste de cor nos dois temas.
name: Conferências

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sintaxe-e-logica:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: vercel.json é JSON válido
        run: node -e "JSON.parse(require('fs').readFileSync('vercel.json','utf8'))"
      - name: Sintaxe de todo JavaScript do site (fora de apps/)
        run: |
          falhas=0
          for f in $(git ls-files '*.js' '*.mjs' | grep -v '^apps/'); do
            node --check "$f" || { echo "::error file=$f::erro de sintaxe"; falhas=1; }
          done
          exit $falhas
      - name: Testes da lógica das ferramentas
        working-directory: scripts
        run: node --test "tests/*.test.mjs"

  # Os apps de apps/ têm build, dependências e lockfile próprios (npm
  # workspaces server + web), então cada um roda no seu job. Os testes são
  # de funções puras: nenhum precisa de banco, SMTP, rede ou segredo — por
  # isso não há `env:` aqui. Node 22 cumpre o "engines >=20" dos dois.
  app-chat-ia:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/arriba-chat-ia
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/arriba-chat-ia/package-lock.json
      - run: npm ci --no-audit --no-fund
      # O src/db.ts importa o client gerado; gerar não conecta em banco
      # (o client é criado só no primeiro uso, ver o comentário em db.ts).
      - name: Client do Prisma (mesmo passo do script de build)
        run: npx --workspace=server prisma generate
      - name: Testes do servidor
        run: npm test

  app-comunicados:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/comunicados
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/comunicados/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Testes do servidor
        run: npm test

  contraste:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dependências da conferência
        working-directory: scripts
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Servidor local do site
        run: |
          python3 -m http.server 8899 >/dev/null 2>&1 &
          sleep 2
      - name: Contraste nos dois temas (carregamento e estados abertos)
        working-directory: scripts
        run: npm run contraste
      - name: Roteador (F5, voltar e link copiado nas páginas de pages/)
        working-directory: scripts
        run: npm run rotas

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQL Query Builder - DataCob</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1f2937;
        }
        ::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #6b7280;
        }
        .code-block {
            background: #111827;
            border: 1px solid #374151;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .table-container table {
            width: 100%;
            border-collapse: collapse;
        }
        .table-container th {
            background-color: #374151;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            border-bottom: 2px solid #4b5563;
            color: #60a5fa;
        }
        .table-container td {
            padding: 12px;
            border-bottom: 1px solid #1f2937;
        }
        .table-container tr:hover {
            background-color: #111827;
        }
    </style>
</head>
<body class="bg-gray-900 text-white">
    <div id="app" class="h-screen flex flex-col">
        <!-- Header -->
        <div class="bg-gray-800 border-b border-gray-700 px-6 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold">📊 SQL Query Builder - DataCob</h1>
            <div class="flex gap-2">
                <button onclick="setViewMode('diagram')" id="btn-diagram" class="px-4 py-2 rounded bg-blue-600">Diagram</button>
                <button onclick="setViewMode('query')" id="btn-query" class="px-4 py-2 rounded bg-gray-700 hover:bg-gray-600">Query</button>
                <button onclick="setViewMode('preview')" id="btn-preview" class="px-4 py-2 rounded bg-gray-700 hover:bg-gray-600">Preview</button>
                <button onclick="setViewMode('export')" id="btn-export" class="px-4 py-2 rounded bg-gray-700 hover:bg-gray-600">Export</button>
            </div>
        </div>

        <!-- Main Content -->
        <div class="flex-1 flex overflow-hidden">
            <!-- Left Sidebar -->
            <div class="w-64 bg-gray-800 border-r border-gray-700 overflow-y-auto p-4">
                <h2 class="text-lg font-bold mb-4">📋 Tabelas</h2>
                <div id="tables-list" class="space-y-2 mb-6"></div>

                <h2 class="text-lg font-bold mt-6 mb-4">🔧 Filtros</h2>
                <div id="filters-list" class="space-y-3 max-h-96 overflow-y-auto mb-3"></div>
                <button onclick="addCondition()" class="w-full bg-green-600 hover:bg-green-500 px-4 py-2 rounded text-sm font-semibold">
                    + Adicionar Filtro
                </button>
            </div>

            <!-- Main Content Area -->
            <div class="flex-1 overflow-y-auto p-6">
                <!-- Diagram View -->
                <div id="view-diagram" class="hidden">
                    <h2 class="text-xl font-bold mb-4">📐 Diagrama de Relacionamentos</h2>
                    <div id="diagram-content" class="grid grid-cols-2 gap-4"></div>
                </div>

                <!-- Query View -->
                <div id="view-query" class="hidden">
                    <h2 class="text-xl font-bold mb-4">📝 Consulta T-SQL</h2>
                    <div class="bg-gray-800 border border-gray-700 rounded-lg p-4 font-mono text-sm overflow-x-auto mb-4 code-block" id="query-output"></div>
                    
                    <div id="case-when-section" class="hidden">
                        <h3 class="text-lg font-bold mb-2">CASE WHEN Configuration:</h3>
                        <div class="bg-gray-800 border border-gray-700 rounded-lg p-4 mb-4">
                            <div class="mb-3">
                                <label class="block text-sm mb-1">Lógica:</label>
                                <select id="case-logic" onchange="updateQuery()" class="w-full bg-gray-700 px-3 py-2 rounded">
                                    <option value="AND">AND</option>
                                    <option value="OR">OR</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm mb-1">Resultado THEN:</label>
                                <input type="text" id="case-result" value="Sim - Entrada Diferente" onchange="updateQuery()" class="w-full bg-gray-700 px-3 py-2 rounded">
                            </div>
                        </div>
                        <h3 class="text-lg font-bold mb-2">Generated CASE WHEN:</h3>
                        <div class="bg-gray-800 border border-green-500 rounded-lg p-4 font-mono text-sm overflow-x-auto code-block" id="case-when-output"></div>
                    </div>
                </div>

                <!-- Preview View -->
                <div id="view-preview" class="hidden">
                    <h2 class="text-xl font-bold mb-4">👁️ Preview dos Dados</h2>
                    <div class="bg-gray-800 border border-gray-700 rounded-lg overflow-x-auto table-container">
                        <table id="preview-table">
                            <thead id="preview-thead"></thead>
                            <tbody id="preview-tbody"></tbody>
                        </table>
                    </div>
                    <p class="text-gray-400 mt-2 text-sm">Total de registros: <span id="record-count">0</span></p>
                </div>

                <!-- Export View -->
                <div id="view-export" class="hidden">
                    <h2 class="text-xl font-bold mb-4">📥 Exportar Dados</h2>
                    <div class="grid grid-cols-3 gap-4">
                        <button onclick="exportXLSX()" class="bg-green-600 hover:bg-green-500 px-6 py-4 rounded-lg text-lg font-semibold">
                            📊 Download XLSX
                        </button>
                        <button onclick="exportCSV()" class="bg-blue-600 hover:bg-blue-500 px-6 py-4 rounded-lg text-lg font-semibold">
                            📄 Download CSV
                        </button>
                        <button onclick="setViewMode('preview')" class="bg-purple-600 hover:bg-purple-500 px-6 py-4 rounded-lg text-lg font-semibold">
                            👁️ Ver Preview
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Data Structure
        const TABLES_STRUCTURE = {
            Contrato: {
                schema: 'Cob',
                fields: ['Id_Contrato', 'Id_Cliente', 'Id_Grupo', 'Id_Financiado', 'Id_Cliente_Web', 'Numero_Contrato'],
                relationships: ['Parcela', 'Historico', 'Cliente', 'Grupo']
            },
            Parcela: {
                schema: 'Cob',
                fields: ['Id_Parcela', 'Id_Cliente', 'Id_Contrato', 'Tipo_Parcela', 'Dt_Vencimento'],
                relationships: ['Contrato', 'Negociacao_Parcela', 'Parcela_Acordo']
            },
            Acordo: {
                schema: 'Cob',
                fields: ['Id_Acordo', 'Id_Negociacao', 'Id_Agrupamento', 'Id_Cliente_Web', 'Dt_Acordo'],
                relationships: ['Negociacao', 'Parcela_Acordo']
            },
            Negociacao: {
                schema: 'Cob',
                fields: ['Id_Negociacao', 'Id_Negociacao_Parcela', 'Id_Parcela', 'Vl_Total', 'Vl_Principal'],
                relationships: ['Parcela', 'Acordo']
            },
            Parcela_Acordo: {
                schema: 'Cob',
                fields: ['Id_Parcela_Acordo', 'Id_Parcela', 'Id_Acordo', 'Dt_Vencimento', 'Vl_Parcela'],
                relationships: ['Parcela', 'Acordo']
            },
            Cliente: {
                schema: 'Par',
                fields: ['Id_Cliente', 'Id_Grupo', 'Razao', 'Nome_Ren', 'Endereco', 'Numero'],
                relationships: ['Contrato', 'Grupo']
            }
        };

        const FILTER_OPERATORS = [
            { id: 'no_filter', label: 'Não Filtrar', template: '' },
            { id: 'null', label: 'Nulos', template: 'IS NULL' },
            { id: 'not_null', label: 'Não Nulos', template: 'IS NOT NULL' },
            { id: 'equal', label: 'Igual', template: '= {value}' },
            { id: 'different', label: 'Diferente', template: '<> {value}' },
            { id: 'greater', label: 'Maior', template: '> {value}' },
            { id: 'between', label: 'Entre', template: 'BETWEEN {min} AND {max}' },
            { id: 'in', label: 'Na Lista', template: 'IN ({values})' },
            { id: 'like_contains', label: 'Contendo', template: "LIKE '%{value}%'" }
        ];

        // State
        let selectedTables = ['Contrato', 'Parcela'];
        let conditions = [
            { field: 'Nr_Parcela', table: 'Parcela', operator: 'equal', value: '1', caseWhen: true }
        ];
        let caseWhenLogic = 'AND';
        let caseWhenResult = 'Sim - Entrada Diferente';
        let queryResult = [];
        let currentView = 'diagram';

        // Initialize
        function init() {
            renderTables();
            renderFilters();
            renderDiagram();
            generateMockData();
        }

        // Render Tables
        function renderTables() {
            const html = Object.keys(TABLES_STRUCTURE).map(table => `
                <label class="flex items-center gap-2 p-2 hover:bg-gray-700 rounded cursor-pointer">
                    <input type="checkbox" ${selectedTables.includes(table) ? 'checked' : ''} 
                           onchange="toggleTable('${table}')" class="w-4 h-4">
                    <span class="text-sm">${table}</span>
                </label>
            `).join('');
            document.getElementById('tables-list').innerHTML = html;
        }

        // Toggle Table
        function toggleTable(table) {
            if (selectedTables.includes(table)) {
                selectedTables = selectedTables.filter(t => t !== table);
            } else {
                selectedTables.push(table);
            }
            renderTables();
            renderDiagram();
            updateQuery();
        }

        // Render Filters
        function renderFilters() {
            const html = conditions.map((cond, idx) => `
                <div class="bg-gray-700 p-3 rounded text-sm">
                    <div class="flex gap-2 mb-2">
                        <select onchange="updateCondition(${idx}, 'table', this.value)" class="flex-1 bg-gray-600 px-2 py-1 rounded text-xs">
                            ${selectedTables.map(t => `<option ${cond.table === t ? 'selected' : ''} value="${t}">${t}</option>`).join('')}
                        </select>
                        <button onclick="removeCondition(${idx})" class="bg-red-600 hover:bg-red-500 px-2 py-1 rounded text-xs">✕</button>
                    </div>
                    <select onchange="updateCondition(${idx}, 'field', this.value)" class="w-full bg-gray-600 px-2 py-1 rounded text-xs mb-2">
                        ${TABLES_STRUCTURE[cond.table].fields.map(f => `<option ${cond.field === f ? 'selected' : ''} value="${f}">${f}</option>`).join('')}
                    </select>
                    <select onchange="updateCondition(${idx}, 'operator', this.value)" class="w-full bg-gray-600 px-2 py-1 rounded text-xs mb-2">
                        ${FILTER_OPERATORS.map(op => `<option ${cond.operator === op.id ? 'selected' : ''} value="${op.id}">${op.label}</option>`).join('')}
                    </select>
                    ${!['null', 'not_null', 'no_filter'].includes(cond.operator) ? `
                        <input type="text" value="${cond.value || ''}" onchange="updateCondition(${idx}, 'value', this.value)" 
                               placeholder="Valor" class="w-full bg-gray-600 px-2 py-1 rounded text-xs text-white mb-2">
                    ` : ''}
                    <label class="flex items-center gap-2">
                        <input type="checkbox" ${cond.caseWhen ? 'checked' : ''} 
                               onchange="updateCondition(${idx}, 'caseWhen', this.checked)" class="w-3 h-3">
                        <span class="text-xs">Usar em CASE WHEN</span>
                    </label>
                </div>
            `).join('');
            document.getElementById('filters-list').innerHTML = html;
        }

        // Update Condition
        function updateCondition(idx, prop, value) {
            conditions[idx][prop] = value;
            renderFilters();
            updateQuery();
        }

        // Add Condition
        function addCondition() {
            conditions.push({
                field: 'Id_Parcela',
                table: selectedTables[0] || 'Contrato',
                operator: 'equal',
                value: '',
                caseWhen: true
            });
            renderFilters();
        }

        // Remove Condition
        function removeCondition(idx) {
            conditions.splice(idx, 1);
            renderFilters();
            updateQuery();
        }

        // Render Diagram
        function renderDiagram() {
            const html = selectedTables.map(table => `
                <div class="bg-gray-800 border-2 border-blue-500 rounded-lg p-4">
                    <h3 class="font-bold text-lg mb-2 text-blue-400">${table}</h3>
                    <div class="text-xs space-y-1">
                        <p class="text-gray-400">Schema: ${TABLES_STRUCTURE[table].schema}</p>
                        <div class="mt-2">
                            <p class="text-gray-300 font-semibold">Fields:</p>
                            ${TABLES_STRUCTURE[table].fields.map(f => `<p class="text-gray-400 ml-2">• ${f}</p>`).join('')}
                        </div>
                        ${TABLES_STRUCTURE[table].relationships.length > 0 ? `
                            <div class="mt-2">
                                <p class="text-gray-300 font-semibold">Relationships:</p>
                                ${TABLES_STRUCTURE[table].relationships.map(r => `<p class="text-yellow-400 ml-2">→ ${r}</p>`).join('')}
                            </div>
                        ` : ''}
                    </div>
                </div>
            `).join('');
            document.getElementById('diagram-content').innerHTML = html;
        }

        // Generate CASE WHEN
        function generateCaseWhen() {
            const caseConditions = conditions.filter(c => c.caseWhen);
            if (caseConditions.length === 0) return '';
            
            const condStrings = caseConditions.map(c => {
                const op = FILTER_OPERATORS.find(o => o.id === c.operator);
                let condition = op.template;
                condition = condition.replace('{value}', c.value || '');
                return `[${c.table}].[${c.field}] ${condition}`;
            });

            const whenClause = condStrings.join(` ${caseWhenLogic} `);
            return `CASE
  WHEN ${whenClause}
  THEN "${caseWhenResult}"
  ELSE "Não"
END`;
        }

        // Generate Query
        function generateFullQuery() {
            const caseWhen = generateCaseWhen();
            return `SELECT
  [Contrato].[Id_Contrato],
  [Contrato].[Numero_Contrato],
  [Parcela].[Id_Parcela],
  [Parcela].[Dt_Vencimento],
  [Parcela].[Tipo_Parcela],
  ${caseWhen ? `${caseWhen} AS [Entrada_Diferenciada],` : ''}
  [Cliente].[Nome_Ren]
FROM [Cob].[Contrato]
INNER JOIN [Cob].[Parcela] ON [Contrato].[Id_Contrato] = [Parcela].[Id_Contrato]
INNER JOIN [Par].[Cliente] ON [Contrato].[Id_Cliente] = [Cliente].[Id_Cliente]`;
        }

        // Update Query
        function updateQuery() {
            caseWhenLogic = document.getElementById('case-logic')?.value || 'AND';
            caseWhenResult = document.getElementById('case-result')?.value || 'Sim - Entrada Diferente';
            
            document.getElementById('query-output').textContent = generateFullQuery();
            
            if (conditions.some(c => c.caseWhen)) {
                document.getElementById('case-when-section').classList.remove('hidden');
                document.getElementById('case-when-output').textContent = generateCaseWhen();
            } else {
                document.getElementById('case-when-section').classList.add('hidden');
            }
        }

        // Generate Mock Data
        function generateMockData() {
            queryResult = [];
            for (let i = 1; i <= 10; i++) {
                queryResult.push({
                    'Id_Contrato': 1000 + i,
                    'Numero_Contrato': `CT-2024-${String(i).padStart(5, '0')}`,
                    'Id_Parcela': i,
                    'Dt_Vencimento': `2024-${String((i % 12) + 1).padStart(2, '0')}-15`,
                    'Tipo_Parcela': i === 1 ? 'Entrada' : 'Parcela',
                    'Entrada_Diferenciada': i === 1 ? 'Sim - Entrada Diferente' : 'Não',
                    'Nome_Ren': `Cliente ${i}`
                });
            }
            renderPreview();
        }

        // Render Preview
        function renderPreview() {
            if (queryResult.length === 0) return;
            
            const headers = Object.keys(queryResult[0]);
            const thead = document.getElementById('preview-thead');
            const tbody = document.getElementById('preview-tbody');
            
            thead.innerHTML = `<tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr>`;
            tbody.innerHTML = queryResult.map((row, idx) => 
                `<tr>${headers.map(h => `<td>${row[h]}</td>`).join('')}</tr>`
            ).join('');
            
            document.getElementById('record-count').textContent = queryResult.length;
        }

        // Export XLSX
        function exportXLSX() {
            const worksheet = XLSX.utils.json_to_sheet(queryResult);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, 'Results');
            XLSX.writeFile(workbook, 'query_result.xlsx');
        }

        // Export CSV
        function exportCSV() {
            const worksheet = XLSX.utils.json_to_sheet(queryResult);
            const csv = XLSX.utils.sheet_to_csv(worksheet);
            const element = document.createElement('a');
            element.setAttribute('href', 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv));
            element.setAttribute('download', 'query_result.csv');
            element.click();
        }

        // Set View Mode
        function setViewMode(mode) {
            currentView = mode;
            ['diagram', 'query', 'preview', 'export'].forEach(v => {
                document.getElementById(`view-${v}`).classList.add('hidden');
                document.getElementById(`btn-${v}`).className = 'px-4 py-2 rounded bg-gray-700 hover:bg-gray-600';
            });
            document.getElementById(`view-${mode}`).classList.remove('hidden');
            document.getElementById(`btn-${mode}`).className = 'px-4 py-2 rounded bg-blue-600';
            
            if (mode === 'query') updateQuery();
            if (mode === 'preview') renderPreview();
        }

        // Initialize on load
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
